[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuldee"
version = "0.1.0"
description = "Modular deep-learning vulnerability detector and localizer (a modern VulDeeLocator reimplementation)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "gensim>=4.3",
    "tree-sitter>=0.22",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.23",
    "tqdm>=4.66",
]

[project.scripts]
vuldee = "vuldee.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vuldee*"]
